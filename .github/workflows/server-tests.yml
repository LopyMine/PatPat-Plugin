name: Run plugin on servers

on:
  workflow_call:

jobs:
  server-tests:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        kernel: [ paper, bukkit, spigot]
        version: [ '1.16.5', '1.21.1' ]
    env:
      SERVER_FOLDER: ${{ matrix.kernel }}_${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      - name: install server
        run: curl -fsSL https://raw.githubusercontent.com/nikita51bot/MinecraftServerDownloader/refs/heads/main/auto_download_minecraft_server.sh | bash -s -- --version ${{ matrix.version }} --kernel ${{ matrix.kernel }}
      - name: download plugin
        uses: actions/download-artifact@v4
        with:
          name: plugin
          path: ./${{ env.SERVER_FOLDER }}/plugins/
      - name: install dependencies
        run: sudo apt install expect openjdk-21-jre -y
      - run: ls -lsa .
      - name: copy test in server folder
        run: cp .github/scripts/server-test.exp ./$SERVER_FOLDER/
      - name: make scripts executable
        working-directory: ./${{ env.SERVER_FOLDER }}
        run: |
          chmod +x *.sh
          chmod +x *.exp
      - name: check server folder
        working-directory: ./${{ env.SERVER_FOLDER }}
        run: ls -lsa .
      - name: run test
        working-directory: ./${{ env.SERVER_FOLDER }}
        run: ./server-test.exp



