# This test all pushes and pull_requests

name: tests
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    uses: ./.github/workflows/build.yml

  bukkit-server-tests:
    needs: build
    strategy:
      matrix:
        version: [ "1.16.5", "1.20.1", "1.21.11" ]
    uses: ./.github/workflows/server-test.yml
    with:
      kernel: "bukkit"
      version: ${{ matrix.version }}

  spigot-server-tests:
    needs: build
    strategy:
      matrix:
        version: [ "1.16.5", "1.20.1", "1.21.11" ]
    uses: ./.github/workflows/server-test.yml
    with:
      kernel: "spigot"
      version: ${{ matrix.version }}

  paper-server-tests:
    needs: build
    strategy:
      matrix:
        version: [ "1.16.5", "1.20.1", "1.21.11" ]
    uses: ./.github/workflows/server-test.yml
    with:
      kernel: "paper"
      version: ${{ matrix.version }}